name: CI Pipeline

# When should this pipeline run?
on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # JOB 1: BACKEND CI (Lint / Syntax / Tests)
  # ==========================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # Step 1: Download/Clone repository code into runner VM
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime with npm cache enabled
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Step 3: Clean install exact dependencies from package-lock.json
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run backend tests & syntax validation
      - name: Run Backend Syntax & Tests
        run: npm test

  # ==========================================
  # JOB 2: FRONTEND CI (Lint & Production Build)
  # ==========================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # Step 1: Download/Clone repository code into runner VM
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime with npm cache enabled
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Clean install exact dependencies from package-lock.json
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run ESLint to catch syntax & code quality issues
      - name: Run Linter
        run: npm run lint

      # Step 5: Verify production bundle builds without errors
      - name: Build Vite App
        run: npm run build
